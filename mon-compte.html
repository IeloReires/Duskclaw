<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101526">
  <meta name="description" content="Accès au compte Duskclaw.">
  <title>Mon compte — Duskclaw</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="site-shell.css?v=20261005-header-unified2">
  <style>
    html body.profile-reset-page:not(.home):not(.dual-page){min-height:100vh!important;background:#101526!important;background-image:radial-gradient(ellipse at 50% 0,#202a46 0,transparent 50%),linear-gradient(140deg,#101526,#0d1220)!important;color:#eef0f8!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif!important}
    html body.profile-reset-page:not(.home):not(.dual-page)::before{display:none!important}
    html body.profile-reset-page:not(.home):not(.dual-page)>main.profile-start:not(.cardex-page):not(.family-page):not(.dusk-main){box-sizing:border-box!important;position:relative!important;isolation:auto!important;width:min(1100px,calc(100% - 40px))!important;min-height:52vh!important;margin:36px auto!important;padding:28px 0!important;border:0!important;border-radius:0!important;outline:0!important;background:transparent!important;color:#eef0f8!important;box-shadow:none!important}
    .profile-start .auth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:0}
    .profile-start .panel{padding:clamp(22px,3vw,34px);border:1px solid #303b58;border-radius:18px;background:linear-gradient(145deg,#1b2339,#151b2d);color:#eef0f8;box-shadow:0 18px 50px #05081666}
    .profile-start h2{margin:0 0 20px;color:#f4f2fb;font:650 1.4rem/1.2 Inter,system-ui,sans-serif;letter-spacing:-.02em}
    .profile-start .field{display:grid;gap:8px;margin:15px 0;color:#afb8ce;font-size:.9rem}
    .profile-start .field input{box-sizing:border-box;width:100%;min-height:46px;padding:11px 13px;border:1px solid #35415f;border-radius:10px;background:#0e1424;color:#f2f3fa;font:inherit}
    .profile-start .field input:focus{border-color:#a99cf5;outline:2px solid #a99cf555;outline-offset:1px}
    .profile-start .small{color:#9fa9c0;font-size:.8rem}
    .profile-start .button{display:inline-flex;min-height:44px;align-items:center;justify-content:center;gap:8px;margin-top:8px;padding:10px 16px;border:1px solid #a99cf5;border-radius:10px;background:#a99cf5;color:#17152c;font:700 .9rem Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer}
    .profile-start .button:hover{filter:brightness(1.08)}
    .profile-start .text-button{display:block;margin-top:12px;padding:4px 0;border:0;background:none;color:#88ddcf;font:inherit;text-decoration:underline;cursor:pointer}
    .profile-start .message{min-height:1.5em;margin:12px 0 0;color:#b9c2d5;font-size:.88rem}
    .profile-start .message.error{color:#ffaaa8}.profile-start .message.success{color:#9bd7b1}
    .profile-start .hidden{display:none!important}
    #page-message{padding:14px 16px;border:1px solid #804d58;border-radius:12px;background:#2a1d2c;color:#ffe4df}
    #account-panel{display:none!important}
    @media(max-width:760px){html body.profile-reset-page:not(.home):not(.dual-page)>main.profile-start:not(.cardex-page):not(.family-page):not(.dusk-main){width:calc(100% - 28px)!important;min-height:45vh!important;margin:26px auto!important;padding:0!important;border:0!important;outline:0!important;background:transparent!important;box-shadow:none!important}.profile-start .auth-grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="profile-reset-page">
  <header class="site-shell-header">
    <a class="site-shell-brand" href="index.html" aria-label="Duskclaw — accueil">DUSK<span>CLAW</span></a>
    <button class="site-shell-menu-toggle" type="button" aria-expanded="false" aria-controls="site-shell-menu" aria-label="Ouvrir le menu de navigation"><span></span><span></span><span></span></button>
    <div class="site-shell-actions">
      <a class="site-shell-support" href="soutenir.html">Soutenir</a>
      <a id="moderation-nav-link" class="site-shell-moderation hidden" href="moderation.html">Modération</a>
      <a id="account-nav-link" class="site-shell-account" href="mon-compte.html" aria-label="Mon compte">Mon compte</a>
    </div>
    <nav class="site-shell-menu" id="site-shell-menu" aria-label="Navigation principale" inert>
      <a href="personnages.html">Cardex</a><a href="univers.html">Univers</a><a href="deck-builder.html">Deck Builder</a><a href="evenements.html">Événements</a><a href="faq.html">FAQ</a><a href="regles.html">Les règles <span aria-hidden="true">↗</span></a><a href="amis.html">Amis</a>
    </nav>
  </header>
  <main class="profile-start" aria-label="Espace de compte">
    <div id="page-message" class="message hidden" role="status"></div>
    <section id="auth-panel" class="auth-grid hidden" aria-label="Connexion ou création de compte">
      <form id="login-form" class="panel">
        <h2>Se connecter</h2>
        <label class="field">Adresse e-mail<input name="email" type="email" autocomplete="email" required></label>
        <label class="field">Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button" type="submit">Connexion <span aria-hidden="true">→</span></button>
        <button id="forgot-password" class="text-button" type="button">Mot de passe oublié ?</button>
        <p id="login-message" class="message" aria-live="polite"></p>
      </form>
      <form id="signup-form" class="panel">
        <h2>Créer un compte</h2>
        <label class="field">Pseudo<input name="nickname" type="text" minlength="2" maxlength="15" autocomplete="nickname" required><span class="small">2 à 15 caractères.</span></label>
        <label class="field">Adresse e-mail<input name="email" type="email" autocomplete="email" required></label>
        <label class="field">Mot de passe<input name="password" type="password" autocomplete="new-password" minlength="10" required><span class="small">10 caractères minimum.</span></label>
        <button class="button" type="submit">Créer mon compte <span aria-hidden="true">→</span></button>
        <p id="signup-message" class="message" aria-live="polite"></p>
      </form>
    </section>
    <section id="account-panel" hidden aria-label="Profil"></section>
  </main>
  <footer class="site-shell-footer"><a class="site-shell-contact" href="contact.html">Contact <span aria-hidden="true">↗</span></a><span class="site-shell-handle">@Duskclaw</span></footer>
  <script>
    (() => {
      const SUPABASE_URL = "https://bqqbciifmfbsjurkulfo.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_czfRsCCIui4YMjCk9ImtpQ_loqFKior";
      const SITE_URL = "https://ieloreires.github.io/Duskclaw/";
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const authPanel = document.getElementById("auth-panel");
      const accountPanel = document.getElementById("account-panel");
      const params = new URLSearchParams(location.search);
      const shouldOpenCollection = params.get("redirect") === "collection.html";
      const shouldOpenEvents = params.get("redirect") === "evenements.html";
      const showMessage = (id, text, kind = "") => { const el = document.getElementById(id); el.textContent = text; el.className = "message" + (kind ? " " + kind : ""); };
      const pageMessage = text => { const el = document.getElementById("page-message"); el.textContent = text; el.classList.toggle("hidden", !text); };
      const afterLogin = () => { if (shouldOpenCollection) location.replace("collection.html"); else if (shouldOpenEvents) location.replace("evenements.html"); };
      const renderUser = user => {
        authPanel.classList.toggle("hidden", !!user);
        accountPanel.hidden = !user;
        const link = document.getElementById("account-nav-link");
        if (!user) link.textContent = "Mon compte";
        if (user) client.rpc("is_site_moderator").then(({ data }) => { if (data === true) document.getElementById("moderation-nav-link").classList.remove("hidden"); }).catch(() => {});
      };
      client.auth.onAuthStateChange((_event, session) => { renderUser(session?.user || null); if (session?.user) afterLogin(); });
      client.auth.getSession().then(({ data, error }) => {
        if (error) { pageMessage("Impossible de vérifier la connexion. Recharge la page."); authPanel.classList.remove("hidden"); return; }
        renderUser(data.session?.user || null);
        if (data.session?.user) afterLogin();
      }).catch(() => { pageMessage("Impossible de vérifier la connexion. Recharge la page."); authPanel.classList.remove("hidden"); });
      document.getElementById("login-form").addEventListener("submit", async event => {
        event.preventDefault(); const form = new FormData(event.currentTarget); showMessage("login-message", "Connexion…");
        const { error } = await client.auth.signInWithPassword({ email: form.get("email"), password: form.get("password") });
        if (error) showMessage("login-message", error.message, "error"); else { showMessage("login-message", "Connexion réussie.", "success"); afterLogin(); }
      });
      document.getElementById("signup-form").addEventListener("submit", async event => {
        event.preventDefault(); const form = new FormData(event.currentTarget); const password = String(form.get("password") || ""); const nickname = String(form.get("nickname") || "").trim();
        if (nickname.length < 2 || nickname.length > 15) { showMessage("signup-message", "Le pseudo doit contenir de 2 à 15 caractères.", "error"); return; }
        if (password.length < 10) { showMessage("signup-message", "Choisis au moins 10 caractères.", "error"); return; }
        showMessage("signup-message", "Création du compte…");
        const { data, error } = await client.auth.signUp({ email: form.get("email"), password, options: { data: { nickname }, emailRedirectTo: SITE_URL + "collection.html" } });
        if (error) showMessage("signup-message", error.message, "error");
        else if (data.session) { showMessage("signup-message", "Compte créé.", "success"); afterLogin(); }
        else showMessage("signup-message", "Compte créé. Consulte ta boîte mail pour confirmer ton adresse, puis connecte-toi.", "success");
      });
      document.getElementById("forgot-password").addEventListener("click", async () => {
        const email = document.querySelector('#login-form [name="email"]').value.trim();
        if (!email) { showMessage("login-message", "Entre ton adresse e-mail pour recevoir le lien de réinitialisation.", "error"); return; }
        showMessage("login-message", "Envoi du lien…");
        const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: SITE_URL + "collection.html" });
        showMessage("login-message", error ? error.message : "Si un compte correspond à cette adresse, un lien de réinitialisation vient d’être envoyé.", error ? "error" : "success");
      });
    })();
  </script>
  <script src="site-shell.js?v=20261005-header-unified2"></script>
</body>
</html>
