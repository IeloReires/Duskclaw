  <style>
    :root{color-scheme:light dark;--bg:#111724;--paper:#1a2030;--ink:#ece9e1;--muted:#b8bdca;--accent:#b8a6df;--line:rgba(229,225,243,.2)}
    body[data-time="jour"]{--bg:#f1ead9;--paper:#f8f3e8;--ink:#252920;--muted:#66695f;--accent:#8a6a37;--line:rgba(60,58,47,.24);color-scheme:light}body[data-time="nuit"]{color-scheme:dark}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}.shell{width:min(1320px,90%);margin-inline:auto}.header{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:83px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.19em;text-decoration:none}.brand span{color:var(--accent)}.nav{display:flex;align-items:center;gap:clamp(14px,3vw,36px)}.nav a{color:var(--muted);font-size:.88rem;text-decoration:none}.nav a:hover,.nav .active{color:var(--accent)}.nav .rules,.nav .support{padding:9px 13px;border:1px solid var(--line);color:var(--ink)}main{width:min(1160px,90%);margin:55px auto 90px}.eyebrow{color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:8px 0 12px;font:400 clamp(2.6rem,7vw,4.5rem)/1.05 Georgia,serif;letter-spacing:-.04em}.lede,.muted{color:var(--muted)}.notice{margin:20px 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--muted)}.notice.error{border-color:#b65d63;color:#ad555b}.hidden{display:none!important}.toolbar{display:flex;gap:12px;align-items:center;margin:24px 0}.toolbar input{flex:1;min-width:180px}.field{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}.layout{display:grid;grid-template-columns:minmax(250px,.85fr) minmax(0,1.4fr);gap:20px;align-items:start}.panel{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}.user-list{display:grid;gap:8px;max-height:75vh;overflow:auto}.user-row{display:grid;width:100%;gap:2px;padding:12px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.user-row:hover,.user-row[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}.user-row small{color:var(--muted);overflow-wrap:anywhere}.user-line{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{padding:2px 8px;border-radius:999px;background:#315640;color:#c8f1d2;font-size:.72rem}.status.banned{background:#6a343b;color:#ffe1e0}.profile-head{display:flex;align-items:center;gap:16px}.avatar{width:86px;height:86px;flex:0 0 86px;display:grid;place-items:center;overflow:hidden;border:2px solid var(--line);border-radius:50%;background:var(--bg);font-size:2rem}.avatar img{width:100%;height:100%;object-fit:cover}.profile-head h2{margin:0;font:400 1.8rem Georgia,serif;overflow-wrap:anywhere}.profile-head p{margin:2px 0;color:var(--muted);overflow-wrap:anywhere}.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.detail{padding:12px;border:1px solid var(--line);border-radius:10px}.detail small{display:block;color:var(--muted)}.detail strong{overflow-wrap:anywhere}.section-title{margin:24px 0 8px;font:400 1.4rem Georgia,serif}.badge-pills{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--accent);font-size:.83rem}.actions{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:18px}.actions label{display:grid;flex:1;min-width:180px;gap:5px;color:var(--muted);font-size:.85rem}.button{display:inline-flex;min-height:43px;align-items:center;justify-content:center;padding:9px 15px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:#171520;font:inherit;font-weight:750;cursor:pointer}.button.secondary{border-color:var(--line);background:transparent;color:var(--ink)}.button.danger{border-color:#b65d63;background:#8c3d44;color:white}.button:disabled{opacity:.6;cursor:wait}.empty{padding:24px;color:var(--muted);text-align:center}.footer{display:flex;justify-content:space-between;gap:18px;padding:25px 0 32px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}.footer a{color:var(--accent)}
    .global-mode-switch{position:fixed;z-index:30;bottom:22px;left:22px;display:inline-flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--muted);font-size:.76rem;font-weight:700;box-shadow:0 5px 22px rgba(18,21,29,.2);cursor:pointer}.global-mode-switch input{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.global-mode-track{position:relative;width:40px;height:22px;border:1px solid var(--line);border-radius:20px;background:#d9cfb9}.global-mode-track::before{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fffaf0;content:"";transition:transform .25s}.global-mode-switch input:checked+.global-mode-track{background:#5e527f}.global-mode-switch input:checked+.global-mode-track::before{transform:translateX(18px);background:#e5dcf5}
    .badge-awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.badge-award{display:flex;align-items:center;gap:12px;min-width:0;padding:12px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--bg) 55%,var(--paper))}.badge-medal{--metal-1:#c98545;--metal-2:#75401e;position:relative;display:grid;width:58px;height:66px;flex:0 0 58px;place-items:center;clip-path:polygon(50% 0,91% 17%,86% 72%,50% 100%,14% 72%,9% 17%);background:linear-gradient(135deg,var(--metal-1),var(--metal-2) 46%,var(--metal-1) 67%,#4a2d1d);filter:drop-shadow(0 4px 5px #0006)}.badge-medal::before{position:absolute;inset:4px;clip-path:inherit;border:1px solid #fff9;background:linear-gradient(145deg,#ffffff42,transparent 48%,#0003)}.badge-medal span{position:relative;color:#fff8e8;font-size:1.5rem;text-shadow:0 2px 3px #342012}.badge-award[data-rarity="bronze"] .badge-medal{--metal-1:#e0a36b;--metal-2:#73401f}.badge-award[data-rarity="silver"] .badge-medal{--metal-1:#f0f2f2;--metal-2:#747c88}.badge-award[data-rarity="gold"] .badge-medal{--metal-1:#fff0a0;--metal-2:#a96a18}.badge-award[data-rarity="platinum"] .badge-medal{--metal-1:#dddcff;--metal-2:#6867a2}.badge-award-copy{display:grid;gap:2px;min-width:0;flex:1}.badge-award-copy strong{overflow-wrap:anywhere}.badge-award-copy small{color:var(--muted);font-size:.76rem;text-transform:capitalize}.badge-award .button{min-height:34px;padding:6px 9px;font-size:.78rem}.badge-award .button:disabled{opacity:.55}.badge-choice-note{width:100%;margin:0;color:var(--muted);font-size:.82rem}
    @media(max-width:760px){.header{flex-wrap:wrap;padding-block:16px}.nav{order:3;width:100%;justify-content:space-between;gap:8px}.nav a{font-size:.76rem}.layout{grid-template-columns:1fr}.user-list{max-height:40vh}.details-grid{grid-template-columns:1fr 1fr}.global-mode-switch{position:static;width:max-content;margin:20px auto 24px;box-shadow:none}.footer{flex-direction:column}}

  <main>
    <p class="eyebrow">ESPACE PRIVÉ</p><h1>Modération<span style="color:var(--accent)">.</span></h1><p class="lede">Comptes inscrits, profils et outils de modération.</p>
    <div id="status" class="notice" role="status">Vérification du compte…</div>
    <section id="dashboard" class="hidden">
      <div class="toolbar"><input id="search" class="field" type="search" placeholder="Chercher par pseudo ou adresse e-mail" aria-label="Chercher un membre"><span id="user-count" class="muted"></span></div>
      <div class="layout"><section class="panel"><h2>Comptes inscrits</h2><div id="user-list" class="user-list"></div></section><section id="profile-panel" class="panel"><div class="empty">Choisis un compte dans la liste pour afficher son profil.</div></section></div>
    </section>
  </main>
  <label class="global-mode-switch" title="Basculer entre les ambiances Jour et Nuit"><span>Jour</span><input id="global-mode-toggle" type="checkbox" role="switch" aria-label="Ambiance Nuit"><span class="global-mode-track" aria-hidden="true"></span><span>Nuit</span></label>

</footer>
  <script>
    (()=>{const t=document.getElementById('global-mode-toggle'),v=localStorage.getItem('duskclaw-time');document.body.dataset.time=v==='jour'?'jour':'nuit';t.checked=document.body.dataset.time==='nuit';t.addEventListener('change',()=>{document.body.dataset.time=t.checked?'nuit':'jour';localStorage.setItem('duskclaw-time',t.checked?'nuit':'jour')})})();
  </script>
  <script>
    const SUPABASE_URL='https://bqqbciifmfbsjurkulfo.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY='sb_publishable_czfRsCCIui4YMjCk9ImtpQ_loqFKior';
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    const status=document.getElementById('status'),dashboard=document.getElementById('dashboard'),list=document.getElementById('user-list'),profilePanel=document.getElementById('profile-panel');
    let users=[], selected=null, badgeCatalog={};
    const BADGE_NAMES={founder:'Fondateur',pioneer:'Pionnier',ally:'Allié',artist:'Artiste',playtester:'Testeur',community:'Esprit de communauté'};
    function say(text,error=false){status.textContent=text;status.classList.toggle('error',error)}
    function esc(value){return String(value??'')}
    function isBanned(user){return user.banned_until&&new Date(user.banned_until).getTime()>Date.now()}
    function fmt(value){if(!value)return 'Jamais';const date=new Date(value);return Number.isNaN(date.getTime())?'Inconnu':new Intl.DateTimeFormat('fr-FR',{dateStyle:'medium',timeStyle:'short'}).format(date)}
    function renderList(){const q=document.getElementById('search').value.trim().toLocaleLowerCase('fr');const shown=users.filter(u=>(u.nickname+' '+u.email).toLocaleLowerCase('fr').includes(q));document.getElementById('user-count').textContent=shown.length+' / '+users.length+' membres';list.replaceChildren();if(!shown.length){const p=document.createElement('p');p.className='empty';p.textContent='Aucun compte correspondant.';list.append(p);return}for(const u of shown){const b=document.createElement('button');b.type='button';b.className='user-row';b.setAttribute('aria-current',String(selected?.id===u.id));const line=document.createElement('span');line.className='user-line';const name=document.createElement('strong');name.textContent=u.nickname||u.email;const state=document.createElement('span');state.className='status'+(isBanned(u)?' banned':'');state.textContent=isBanned(u)?'Banni':'Actif';line.append(name,state);const mail=document.createElement('small');mail.textContent=u.email;b.append(line,mail);b.addEventListener('click',()=>{selected=u;renderList();renderProfile()});list.append(b)}}
    function renderProfile(){if(!selected)return;profilePanel.replaceChildren();const head=document.createElement('div');head.className='profile-head';const avatar=document.createElement('div');avatar.className='avatar';if(selected.avatar_url){const img=new Image();img.src=selected.avatar_url;img.alt='';avatar.append(img)}else avatar.textContent=(selected.nickname||selected.email).slice(0,1).toUpperCase();const identity=document.createElement('div');const title=document.createElement('h2');title.textContent=selected.nickname||'Profil sans pseudo';const email=document.createElement('p');email.textContent=selected.email;identity.append(title,email);head.append(avatar,identity);profilePanel.append(head);
      const grid=document.createElement('div');grid.className='details-grid';for(const [label,value] of [['Inscription',fmt(selected.created_at)],['Dernière connexion',fmt(selected.last_sign_in_at)],['Cartes possédées',selected.collection_count],['Cartes mises à l’honneur',(selected.featured_cards||[]).length]]){const box=document.createElement('div');box.className='detail';const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=String(value);box.append(small,strong);grid.append(box)}profilePanel.append(grid);
      const title2=document.createElement('h3');title2.className='section-title';title2.textContent='Badges offerts';profilePanel.append(title2);const awards=document.createElement('div');awards.className='badge-awards';
      if(!selected.badges.length){const no=document.createElement('p');no.className='badge-choice-note';no.textContent='Aucun badge offert pour le moment.';awards.append(no)}
      for(const key of selected.badges){const badge=badgeCatalog[key]||{name:BADGE_NAMES[key]||key,icon:'✦',rarity:'bronze'};const rarity=['bronze','silver','gold','platinum'].includes(badge.rarity)?badge.rarity:'bronze';const item=document.createElement('article');item.className='badge-award';item.dataset.rarity=rarity;const medal=document.createElement('span');medal.className='badge-medal';medal.setAttribute('aria-label',rarity+' badge');const symbol=document.createElement('span');symbol.textContent=badge.icon||'✦';medal.append(symbol);const copy=document.createElement('span');copy.className='badge-award-copy';const name=document.createElement('strong');name.textContent=badge.name||key;const tier=document.createElement('small');tier.textContent=rarity;copy.append(name,tier);const remove=document.createElement('button');remove.className='button secondary';remove.type='button';remove.textContent='Retirer';remove.setAttribute('aria-label','Retirer le badge '+(badge.name||key));remove.addEventListener('click',()=>runAction('revoke_badge',{badge_key:key}));item.append(medal,copy,remove);awards.append(item)}profilePanel.append(awards);
      const actions=document.createElement('div');actions.className='actions';const label=document.createElement('label');label.textContent='Offrir un badge';const select=document.createElement('select');select.className='field';select.id='badge-choice';const available=Object.entries(badgeCatalog).filter(([key])=>!selected.badges.includes(key));for(const [key,badge] of available){const option=document.createElement('option');option.value=key;option.textContent=(badge.icon||'✦')+' '+badge.name+' · '+badge.rarity;select.append(option)}label.append(select);const award=document.createElement('button');award.className='button';award.type='button';award.textContent='Offrir';award.disabled=!available.length;award.addEventListener('click',()=>runAction('award_badge',{badge_key:select.value}));actions.append(label,award);if(!available.length){const note=document.createElement('p');note.className='badge-choice-note';note.textContent='Tous les badges disponibles ont déjà été attribués à cette personne.';actions.append(note)}profilePanel.append(actions);
      const ban=document.createElement('button');ban.type='button';ban.className='button '+(isBanned(selected)?'secondary':'danger');ban.textContent=isBanned(selected)?'Lever le bannissement':'Bannir ce compte';ban.style.marginTop='20px';ban.addEventListener('click',async()=>{if(isBanned(selected)){await runAction('unban')}else{const ok=confirm('Bannir '+selected.email+' ? Cette personne ne pourra plus se connecter.');if(ok){const reason=prompt('Motif (facultatif) :')||'';await runAction('ban',{reason})}}});profilePanel.append(ban)}
    async function loadUsers(){say('Chargement des comptes…');const {data,error}=await client.functions.invoke('clever-service',{body:{action:'list'}});if(error||data?.error)throw new Error(data?.error||'La liste des comptes n’a pas pu être chargée. Vérifie que la fonction Supabase est déployée.');users=data.users||[];badgeCatalog=data.badges||{};dashboard.classList.remove('hidden');say('');renderList();if(selected){selected=users.find(user=>user.id===selected.id)||null;renderProfile()}}
    async function runAction(action,extra={}){if(!selected)return;const target=selected;const buttons=profilePanel.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);say('Enregistrement de l’action…');const {data,error}=await client.functions.invoke('clever-service',{body:{action,user_id:target.id,...extra}});if(error||data?.error){say(data?.error||'Action refusée. Vérifie la configuration de la fonction.',true);buttons.forEach(b=>b.disabled=false);return}say(data?.audit_logged===false?'Action effectuée, mais son journal n’a pas été enregistré.':'Action effectuée et journalisée.');await loadUsers()}
    document.getElementById('search').addEventListener('input',renderList);
    (async()=>{const {data,error}=await client.auth.getSession();if(error||!data.session?.user){location.replace('mon-compte.html');return}const {data:isMod,error:roleError}=await client.rpc('is_site_moderator');if(roleError||isMod!==true){say('Accès réservé au compte modérateur.',true);return}try{await loadUsers()}catch(e){say(e.message,true)}})();
  </script>
