<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Cardex — Duskclaw</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .cardex-site-header { box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 24px; width: min(1320px, 90%); height: 83px; min-height: 83px; margin-inline: auto; padding: 0; border-bottom: 1px solid var(--dusk-rule); }
    .cardex-site-brand { color: var(--dusk-ink); font-size: 1rem; font-weight: 800; letter-spacing: .19em; text-decoration: none; }
    .cardex-site-brand span { color: var(--dusk-accent); }
    .cardex-site-nav { display: flex; align-items: center; gap: clamp(18px, 3vw, 38px); }
    .cardex-site-nav a { color: var(--dusk-muted); font-size: .88rem; text-decoration: none; }
    .cardex-site-nav a:hover, .cardex-site-nav a:focus-visible { color: var(--dusk-accent); }
    .cardex-site-nav .cardex-rules-link { padding: 10px 14px; border: 1px solid var(--dusk-rule); color: var(--dusk-ink); }
    .cardex-site-nav .cardex-support-link { padding: 10px 14px; background: var(--dusk-accent); color: #fff; font-weight: 700; }
    .cardex-site-nav .cardex-support-link:hover, .cardex-site-nav .cardex-support-link:focus-visible { filter: brightness(1.08); }
    .cardex-page { width: min(1600px, 96%); margin: 0 auto; padding: 38px 0 70px; }
    .cardex-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 40px 0 28px; }
    .cardex-heading h1 { margin: 0; font-size: clamp(2.8rem, 6vw, 5rem); }
    .cardex-heading p { margin: 0 0 8px; color: var(--muted); }
    .cardex-filters { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(3, minmax(130px, 1fr)) minmax(140px, 1fr) auto; align-items: end; gap: 12px; margin: 0 0 16px; }
    .cardex-control { display: grid; gap: 6px; color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .cardex-control input, .cardex-control select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; letter-spacing: normal; text-transform: none; }
    .cardex-control input::placeholder { color: var(--muted); opacity: .8; }
    .filter-reset { min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
    .filter-reset:hover, .filter-reset:focus-visible { border-color: var(--accent); color: var(--accent); }
    .cardex-results { min-height: 1.5em; margin: 0 0 14px; color: var(--muted); font-size: .86rem; }
    .cardex-empty { padding: 32px 0; color: var(--muted); text-align: center; }
    .cardex-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    .furry-entry[hidden] { display: none !important; }
    .furry-entry { --rarity-color: transparent; position: relative; display: block; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 18px; background: #f2f2f1; color: #25262a; text-decoration: none; box-shadow: 0 5px 16px rgba(0,0,0,.14); transition: transform .2s ease, box-shadow .2s ease, outline-color .2s ease; }
    .rarity-commun { --rarity-color: #b87945; }
    .rarity-peu-commun { --rarity-color: #c8d0d8; }
    .rarity-rare { --rarity-color: #e3b84f; }
    .rarity-epique { --rarity-color: #bd83ec; }
    .rarity-legendaire { --rarity-color: #7de0d1; }
    .furry-entry:hover, a.furry-entry:focus-visible { z-index: 2; transform: translateY(-4px) scale(1.025); box-shadow: 0 12px 30px rgba(0,0,0,.34), 0 0 22px color-mix(in srgb, var(--rarity-color) 55%, transparent); outline: 3px solid var(--rarity-color); outline-offset: 2px; }
    .furry-entry img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center 28%; }
    .furry-caption { position: absolute; inset: auto 0 0; display: flex; flex-direction: column; gap: 3px; padding: 28px 12px 11px; color: white; background: linear-gradient(transparent, rgba(18,19,23,.86)); }
    .furry-caption strong { font-size: 1rem; }
    .furry-caption span { font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; }
    .furry-caption .rarity-label { color: var(--rarity-color); font-weight: 800; }
    .card-stat-details { display: none; gap: 3px 9px; flex-wrap: wrap; margin-top: 5px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.28); font-size: .62rem !important; letter-spacing: .02em !important; text-transform: none !important; }
    .furry-placeholder > .card-stat-details { position: absolute; inset: auto 0 0; z-index: 1; margin: 0; padding: 10px; border: 0; background: rgba(18,19,23,.9); color: white; }
    .furry-caption > .card-stat-details { position: static; }
    .furry-entry:hover .card-stat-details, .furry-entry:focus-visible .card-stat-details { display: flex; }
    .card-stat-details .stat-role { flex-basis: 100%; color: #f1d89b; font-weight: 700; }
    @media (hover: none) { .card-stat-details { display: flex; } }
    .furry-placeholder { display: grid; place-items: center; background: #e7e7e5; box-shadow: inset 0 0 0 1px rgba(35,36,39,.05); }
    .placeholder-mark { width: 42%; aspect-ratio: 1; display: grid; place-items: center; border: 3px solid #b6b7b8; border-radius: 50%; color: #aaabad; font-size: clamp(2rem, 5vw, 4rem); font-weight: 300; }
    .placeholder-label { position: absolute; inset: auto 6px 12px; color: #777a7e; text-align: center; font-size: .61rem; line-height: 1.45; letter-spacing: .04em; text-transform: uppercase; white-space: pre-line; }
    @media (max-width: 1100px) {
      .cardex-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .cardex-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cardex-control:first-child, .filter-reset { grid-column: 1 / -1; }
    }
    @media (max-width: 680px) {
      .cardex-site-header { flex-wrap: wrap; height: auto; min-height: 82px; padding-block: 17px; }
      .cardex-site-nav { order: 3; width: 100%; justify-content: space-between; gap: 12px; }
      .cardex-site-nav a { font-size: .82rem; }
      .cardex-page { width: 94%; padding-top: 24px; }
      .cardex-heading { align-items: start; flex-direction: column; margin: 30px 0 20px; gap: 8px; }
      .cardex-filters { gap: 9px; }
      .cardex-control { font-size: .65rem; }
      .cardex-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .furry-entry { border-radius: 12px; }
      .furry-caption { padding: 22px 8px 8px; }
      .furry-caption strong { font-size: .85rem; }
      .furry-caption span { font-size: .58rem; }
      .placeholder-label { bottom: 12px; font-size: .58rem; }
    }
    @media (max-width: 420px) { .cardex-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (prefers-reduced-motion: reduce) { .furry-entry { transition: none; } }
      body:not(.dual-page)[data-time="jour"] { --dusk-bg: #f1ead9; --dusk-paper: #f8f3e8; --dusk-ink: #252920; --dusk-muted: #66695f; --dusk-accent: #8a6a37; --dusk-rule: rgba(60,58,47,.24); --bg: #f1ead9; --background: #f1ead9; --surface: #f8f3e8; --text: #252920; --muted: #66695f; --accent: #8a6a37; --line: rgba(60,58,47,.24); background: #f1ead9 !important; color: #252920 !important; color-scheme: light; }
    body:not(.dual-page)[data-time="nuit"] { --dusk-bg: #111724; --dusk-paper: #1a2030; --dusk-ink: #ece9e1; --dusk-muted: #b8bdca; --dusk-accent: #b8a6df; --dusk-rule: rgba(229,225,243,.2); --bg: #111724; --background: #111724; --surface: #1a2030; --text: #ece9e1; --muted: #b8bdca; --accent: #b8a6df; --line: rgba(229,225,243,.2); background: #111724 !important; color: #ece9e1 !important; color-scheme: dark; }
    body:not(.dual-page) { transition: background-color .45s ease, color .45s ease; }
    body:not(.dual-page) :where(.site-header, .rules-toc, .feature-card, .feature-card-alt, .stats-list, .family-info, .filter-reset, .cardex-control input, .cardex-control select, .rule-chapter table, .rule-chapter th, .rule-chapter td, .global-mode-switch) { transition: background-color .45s ease, color .45s ease, border-color .45s ease; }
    .global-mode-switch { position: fixed; z-index: 30; bottom: 22px; left: 22px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 13px; border: 1px solid var(--dusk-rule); background: var(--dusk-paper); color: var(--dusk-muted); font-family: inherit; font-size: .78rem; font-weight: 700; box-shadow: 0 5px 22px rgba(18,21,29,.2); cursor: pointer; }
    body:not(.dual-page)[data-time="jour"] .global-mode-switch .mode-day, body:not(.dual-page)[data-time="nuit"] .global-mode-switch .mode-night { color: var(--dusk-accent); }
    .global-mode-switch input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .global-mode-track { position: relative; width: 42px; height: 23px; border: 1px solid var(--dusk-rule); border-radius: 20px; background: #d9cfb9; transition: background .25s ease; }
    .global-mode-track::before { position: absolute; top: 2px; left: 2px; width: 17px; height: 17px; border-radius: 50%; background: #fffaf0; box-shadow: 0 1px 4px rgba(0,0,0,.24); content: ""; transition: transform .25s ease, background .25s ease; }
    body:not(.dual-page)[data-time="nuit"] .global-mode-track { background: #5e527f; }
    .global-mode-switch input:checked + .global-mode-track::before { transform: translateX(19px); background: #e5dcf5; }
    .global-mode-switch input:focus-visible + .global-mode-track { outline: 2px solid var(--dusk-accent); outline-offset: 3px; }
    @media (max-width: 560px) { .global-mode-switch { bottom: 14px; left: 14px; } }
      @media (max-width: 560px) {
      .global-mode-switch, .dusk-mode-switch, .bouton-mode {
        position: static !important;
        inset: auto !important;

      .product-art {

    }
    .dusk-footer { display:flex; justify-content:space-between; align-items:center; gap:18px; width:min(1320px,90%); margin:32px auto 0; padding:23px 0 30px; border-top:1px solid var(--dusk-rule, var(--line, rgba(60,58,47,.24))); color:var(--dusk-muted, var(--muted, #66695f)); font-size:.8rem; }
    .dusk-footer a { color:var(--dusk-ink, var(--text, #252920)); text-decoration:none; }
    .contact-footer-button { display:inline-flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--dusk-rule, var(--line, rgba(60,58,47,.24))); color:var(--dusk-ink, var(--text, #252920)) !important; font-size:.82rem; font-weight:750; text-decoration:none; transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease; }
    .contact-footer-button:hover,.contact-footer-button:focus-visible { transform:translateY(-2px); border-color:var(--dusk-accent, var(--accent, #8a6a37)); background:var(--dusk-accent, var(--accent, #8a6a37)); color:#fff !important; outline:none; }
    @media (max-width:560px) { .dusk-footer { align-items:flex-start; flex-direction:column; } }

<body data-time="jour">
  <header class="cardex-site-header">
    <a class="cardex-site-brand" href="index.html" aria-label="Duskclaw — accueil">DUSK<span>CLAW</span></a>
    <nav class="cardex-site-nav" aria-label="Navigation principale">
      <a href="univers.html">Univers</a>
      <a class="cardex-rules-link" href="regles.html">Les règles <span aria-hidden="true">↗</span></a>
      <a class="cardex-support-link" href="soutenir.html">Soutenir</a>
    </nav>
  </header>
  <main class="cardex-page">
    <div class="cardex-heading">
      <div>
        <p class="eyebrow">LES FAMILLES DE DUSKCLAW</p>
        <h1>Cardex<span style="color:var(--accent)">.</span></h1>
      </div>
      <p><strong>6</strong> formes illustrées sur 65</p>
    </div>
    <form class="cardex-filters" id="cardex-filters">
      <label class="cardex-control">
        Nom
        <input id="name-filter" type="search" placeholder="Rechercher un Furry…" autocomplete="off">
      </label>
      <label class="cardex-control">
        Niveau
        <select id="level-filter">
          <option value="">Tous les niveaux</option>
          <option value="base">Base</option>
          <option value="niveau-1">Niveau 1</option>
          <option value="niveau-2">Niveau 2</option>
        </select>
      </label>
      <label class="cardex-control">
        Type
        <select id="type-filter">
          <option value="">Tous les types</option>
          <option value="eau">Eau</option>
          <option value="plante">Plante</option>
          <option value="glace">Glace</option>
          <option value="roche">Roche</option>
          <option value="vent">Vent</option>
        </select>
      </label>
      <label class="cardex-control">
        Famille
        <select id="family-filter">
          <option value="">Toutes les familles</option>
          <option value="marin">Marin</option>
          <option value="kael">Kael</option>
          <option value="caine">Caine</option>
        </select>
      </label>
      <label class="cardex-control">
        Rareté
        <select id="rarity-filter">
          <option value="">Toutes les raretés</option>
          <option value="commun">Commun</option>
          <option value="peu-commun">Peu commun</option>
          <option value="rare">Rare</option>
          <option value="epique">Épique</option>
          <option value="legendaire">Légendaire</option>
        </select>
      </label>
      <button class="filter-reset" id="reset-filters" type="button">Tout effacer</button>
    </form>
    <p class="cardex-results" id="cardex-results" aria-live="polite">65 formes classées · 6 illustrées</p>
    <section class="cardex-grid" id="cardex-grid" aria-label="Les 65 emplacements du Cardex"></section>
    <p class="cardex-empty" id="cardex-empty" hidden>Aucun Furry ne correspond à ces filtres.</p>
  </main>
  <script>
    const furries = Array(65).fill(null);
    const familyGroups = [
      [2, "glace"], [3, "eau", "Marin"], [2, "vent"], [3, "plante"],
      [2, "roche"], [3, "glace"], [2, "plante", "Kael"], [3, "eau"],
      [2, "glace"], [3, "roche", "Caine"], [2, "vent"], [3, "plante"],
      [2, "eau"], [3, "vent"], [2, "glace"], [3, "roche"], [1, "eau"],
      [3, "glace"], [2, "plante"], [3, "eau"], [2, "vent"], [3, "roche"],
      [3, "vent"], [2, "plante"], [1, "", "Famille à venir"], [1, "roche"],
      [1, "plante", "", "epique"], [1, "glace", "", "epique"],
      [1, "roche", "", "epique"], [1, "vent", "", "epique"],
      [1, "eau", "", "epique"]
    ];
    const levelNames = ["base", "niveau-1", "niveau-2"];
    const levelLabels = ["Base", "Niveau 1", "Niveau 2"];
    const rarityNames = ["commun", "peu-commun", "rare"];
    const rarityLabels = ["Commun", "Peu commun", "Rare"];
    const rarityLabelByName = { commun: "Commun", "peu-commun": "Peu commun", rare: "Rare", epique: "Épique" };
    let nextCard = 0;
    familyGroups.forEach(([size, type, knownFamily, specialRarity], groupIndex) => {
      const familyName = knownFamily || "Famille " + String(groupIndex + 1).padStart(2, "0");
      for (let stage = 0; stage < size; stage++) {
        const level = levelNames[stage] || "base";
        let rarityIndex = Math.min(stage, 2);
        if (knownFamily === "Kael") rarityIndex = stage === 0 ? 1 : 2;
        const rarity = specialRarity || rarityNames[rarityIndex];
        furries[nextCard++] = {
          name: knownFamily === "Caine" ? "Caine" : knownFamily === "Marin" ? "Marin" : knownFamily === "Kael" ? "Kael" : "",
          familyName, level, levelLabel: levelLabels[stage] || "Base", type,
          rarity, rarityLabel: rarityLabelByName[rarity] || rarityLabels[rarityIndex],
          stage: (levelLabels[stage] || "Base") + (type ? " · " + type : ""),
          image: "", family: knownFamily ? knownFamily.toLocaleLowerCase("fr") + ".html" : ""
        };
      }
    });
    // Stats du prototype, indexées par famille puis par forme (a, b, c).
    const statFamilies = {
      1: { b: ["niveau-1", 80, 2, 30, 1, 3, "Tank"] },
      2: { a: ["base", 50, 3, 30, 1, 2, "Bruiser"], b: ["niveau-1", 80, 4, 40, 1, 3, "Bruiser offensif"] },
      4: { a: ["base", 50, 3, 30, 2, 2, "Harceleur"], b: ["niveau-1", 70, 4, 40, 2, 3, "Harceleur"], c: ["niveau-2", 110, 4, 50, 2, 4, "DPS"] },
      6: { b: ["niveau-1", 60, 5, 50, 1, 3, "Assassin"], c: ["base", 140, 2, 40, 1, 4, "Tank", "epique"] },
      7: { a: ["base", 50, 2, 20, 1, 2, "Soigneur"], b: ["niveau-1", 80, 2, 20, 1, 3, "Soigneur"], c: ["niveau-2", 110, 3, 30, 1, 4, "Soigneur avancé"] },
      8: { a: ["base", 40, 4, 20, 2, 2, "Éclaireur"], b: ["niveau-1", 70, 5, 30, 2, 3, "Éclaireur"] },
      9: { a: ["base", 60, 1, 20, 1, 2, "Muraille"], b: ["niveau-1", 90, 1, 30, 1, 3, "Tank"], c: ["niveau-2", 130, 2, 40, 1, 4, "Tank lourd"] },
      10: { a: ["base", 40, 4, 30, 3, 2, "Tireur mobile"], b: ["niveau-1", 60, 4, 40, 4, 3, "Tireur"], c: ["niveau-2", 90, 5, 50, 4, 4, "Tireur élite"] },
      11: { a: ["base", 50, 2, 30, 1, 2, "Polyvalent"], b: ["niveau-1", 80, 3, 40, 1, 3, "Polyvalent"], c: ["niveau-2", 110, 3, 50, 1, 4, "Combattant"] },
      12: { b: ["niveau-1", 70, 4, 20, 2, 3, "Support mobile"] },
      13: { a: ["base", 60, 2, 30, 1, 2, "Combattant"], b: ["niveau-1", 90, 2, 40, 1, 3, "Bruiser"], c: ["niveau-2", 120, 3, 50, 1, 4, "Bruiser lourd"] },
      15: { c: ["base", 90, 6, 60, 1, 4, "Assassin", "epique"] },
      16: { a: ["base", 40, 5, 20, 2, 2, "Furtif"], b: ["niveau-1", 60, 6, 40, 2, 3, "Assassin mobile"] },
      17: { a: ["base", 60, 2, 20, 4, 2, "Artillerie"], b: ["niveau-1", 80, 2, 30, 4, 3, "Artillerie"], c: ["niveau-2", 110, 3, 40, 5, 4, "Artillerie"] },
      19: { c: ["base", 100, 3, 40, 4, 4, "Combattant", "epique"] },
      20: { a: ["base", 40, 4, 30, 2, 2, "Harceleur"], b: ["niveau-1", 70, 5, 40, 2, 3, "Harceleur"] },
      22: { a: ["base", 40, 4, 30, 1, 2, "Assassin"], b: ["niveau-1", 70, 5, 50, 1, 3, "Assassin"], c: ["niveau-2", 100, 6, 60, 1, 4, "Assassin élite"] },
      23: { a: ["base", 60, 2, 20, 3, 2, "Contrôleur"], b: ["niveau-1", 90, 2, 30, 3, 3, "Contrôleur"] },
      24: { a: ["base", 50, 3, 30, 1, 2, "Offensif"], b: ["niveau-1", 80, 4, 40, 1, 3, "Offensif"], c: ["niveau-2", 110, 4, 50, 1, 4, "DPS"] },
      25: { a: ["base", 50, 2, 20, 3, 2, "Soin"], b: ["niveau-1", 80, 3, 20, 3, 3, "Soin mobile"] },
      26: { a: ["base", 40, 4, 30, 2, 2, "Éclaireur"], b: ["niveau-1", 70, 5, 40, 2, 3, "Éclaireur"], c: ["niveau-2", 100, 6, 50, 2, 4, "Éclaireur élite"] },
      27: { a: ["base", 60, 1, 20, 2, 2, "Tank distance"], b: ["niveau-1", 90, 2, 30, 2, 3, "Tank offensif"] },
      29: { a: ["base", 40, 5, 20, 3, 2, "Tireur furtif"], b: ["niveau-1", 60, 6, 30, 3, 3, "Tireur mobile"] },
      30: { c: ["base", 120, 3, 30, 2, 4, "Soin", "epique"] },
      31: { a: ["base", 50, 3, 20, 2, 2, "Support"], b: ["niveau-1", 80, 4, 30, 2, 3, "Support mobile"], c: ["niveau-2", 110, 4, 40, 2, 4, "Support offensif"] },
      32: { a: ["base", 40, 4, 30, 1, 2, "Dueliste"], b: ["niveau-1", 70, 5, 40, 1, 3, "Dueliste"] },
      33: { a: ["base", 60, 2, 20, 1, 2, "Soin / Tank"], b: ["niveau-1", 90, 2, 30, 1, 3, "Soin / Tank"], c: ["niveau-2", 130, 3, 40, 1, 4, "Gardien soigneur"] },
      34: { a: ["base", 50, 3, 30, 3, 2, "Magie distance"], b: ["niveau-1", 80, 3, 40, 3, 3, "Mage"] },
      35: { c: ["base", 90, 5, 50, 3, 4, "Tireur", "epique"] }
    };
    const familyBlocks = [];
    furries.forEach((furry, index) => {
      let block = familyBlocks.find((item) => item.familyName === furry.familyName);
      if (!block) { block = { familyName: furry.familyName, cards: [], firstIndex: index }; familyBlocks.push(block); }
      block.cards.push(furry);
    });
    const reservedFamilies = { 7: "Marin", 16: "Kael", 17: "Caine" };
    const assignedBlocks = new Set();
    const codeToBlock = {};
    Object.entries(reservedFamilies).forEach(([code, name]) => {
      const block = familyBlocks.find((item) => item.familyName === name);
      if (block) { codeToBlock[code] = block; assignedBlocks.add(block); }
    });
    const remainingCodes = Object.keys(statFamilies).filter((code) => !reservedFamilies[code]).sort((a, b) => Number(a) - Number(b));
    remainingCodes.forEach((code) => {
      const wantedCount = Object.keys(statFamilies[code]).length;
      const block = familyBlocks.find((item) => !assignedBlocks.has(item) && item.cards.length === wantedCount);
      if (block) { codeToBlock[code] = block; assignedBlocks.add(block); }
    });
    Object.entries(statFamilies).forEach(([code, forms]) => {
      const block = codeToBlock[code];
      if (!block) return;
      Object.values(forms).forEach(([level, pv, vit, atk, por, cost, profile, specialRarity]) => {
        const furry = block.cards.find((card) => card.level === level && !card.stats) || block.cards.find((card) => !card.stats);
        if (furry) {
          const keepEpic = furry.rarity === "epique";
          furry.level = level;
          furry.levelLabel = level === "niveau-1" ? "Niveau 1" : level === "niveau-2" ? "Niveau 2" : "Base";
          furry.stage = furry.levelLabel + (furry.type ? " · " + furry.type : "");
          furry.stats = { pv, vit, atk, por, cost, profile, specialRarity: specialRarity || "" };
          if (specialRarity) furry.rarity = specialRarity;
          else if (!keepEpic) furry.rarity = furry.familyName === "Kael" ? (level === "base" ? "peu-commun" : "rare") : ({ base: "commun", "niveau-1": "peu-commun", "niveau-2": "rare" }[level] || furry.rarity);
          furry.rarityLabel = rarityLabelByName[furry.rarity] || "Épique";
        }
      });
    });
    const illustrations = {
      "Marin|base": "marin.png",
      "Marin|niveau-1": "marin-evolution-1.png",
      "Marin|niveau-2": "marin-evolution-2.png",
      "Caine|niveau-2": "caine-niveau-2.png",
      "Kael|base": "kael-base.png",
      "Kael|niveau-1": "kael-evolution-1.png"
    };
    furries.forEach((furry) => {
      const image = illustrations[furry.familyName + "|" + furry.level];
      if (image) furry.image = image;
    });
    const grid = document.getElementById("cardex-grid");
    for (let number = 0; number < 65; number++) {
      const furry = furries[number];
      if (furry && furry.image) {
        const card = document.createElement("a");
        card.className = "furry-entry rarity-" + furry.rarity;
        card.dataset.name = furry.name.toLocaleLowerCase("fr");
        card.dataset.level = furry.level;
        card.dataset.type = furry.type;
        card.dataset.family = furry.familyName.toLocaleLowerCase("fr");
        card.dataset.rarity = furry.rarity;
        card.href = furry.family;
        card.setAttribute("aria-label", "Ouvrir la famille " + furry.name + " — " + furry.stage);
        const image = document.createElement("img");
        image.src = furry.image;
        image.alt = furry.name + " — " + furry.stage;
        const caption = document.createElement("span");
        caption.className = "furry-caption";
        const name = document.createElement("strong");
        name.textContent = furry.name;
        const stage = document.createElement("span");
        stage.textContent = furry.stage;
        const rarity = document.createElement("span");
        rarity.className = "rarity-label";
        rarity.textContent = furry.rarityLabel;
        caption.append(name, stage, rarity);
        if (furry.stats) {
          const details = document.createElement("span");
          details.className = "card-stat-details";
          details.innerHTML = `<span>PV ${furry.stats.pv}</span><span>VIT ${furry.stats.vit}</span><span>ATK ${furry.stats.atk}</span><span>POR ${furry.stats.por}</span><span>Coût ${furry.stats.cost}</span><span class="stat-role">${furry.stats.profile}</span>`;
          caption.append(details);
        }
        card.append(image, caption);
        grid.append(card);
      } else {
        const data = furry || { familyName: "Famille à venir", levelLabel: "", type: "", rarity: "", rarityLabel: "" };
        const card = document.createElement("div");
        card.className = "furry-entry furry-placeholder" + (data.rarity ? " rarity-" + data.rarity : "");
        card.dataset.rarity = data.rarity || "";
        card.dataset.name = (data.name || "").toLocaleLowerCase("fr");
        card.dataset.level = data.level || "";
        card.dataset.type = data.type || "";
        card.dataset.family = (data.familyName || "").toLocaleLowerCase("fr");
        const slotNumber = String(number + 1).padStart(2, "0");
        const typeLabel = data.type ? data.type.charAt(0).toLocaleUpperCase("fr") + data.type.slice(1) : "Type à définir";
        const summary = [data.levelLabel, typeLabel, data.rarityLabel].filter(Boolean).join(" · ");
        card.title = [data.familyName, summary].filter(Boolean).join(" — ");
        card.setAttribute("aria-label", "Emplacement " + slotNumber + " sur 65 — " + card.title);
        const mark = document.createElement("span");
        mark.className = "placeholder-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = slotNumber;
        const label = document.createElement("span");
        label.className = "placeholder-label";
        label.textContent = (data.name || data.familyName) + (summary ? "\n" + summary : "\nÀ venir");
        card.append(mark, label);
        if (data.stats) {
          const details = document.createElement("span");
          details.className = "card-stat-details";
          details.innerHTML = `<span>PV ${data.stats.pv}</span><span>VIT ${data.stats.vit}</span><span>ATK ${data.stats.atk}</span><span>POR ${data.stats.por}</span><span>Coût ${data.stats.cost}</span><span class="stat-role">${data.stats.profile}</span>`;
          card.append(details);
        }
        grid.append(card);
      }
    }
    const nameFilter = document.getElementById("name-filter");
    const levelFilter = document.getElementById("level-filter");
    const typeFilter = document.getElementById("type-filter");
    const familyFilter = document.getElementById("family-filter");
    const rarityFilter = document.getElementById("rarity-filter");
    const results = document.getElementById("cardex-results");
    const emptyMessage = document.getElementById("cardex-empty");
    function filterCardex() {
      const query = nameFilter.value.trim().toLocaleLowerCase("fr");
      let visible = 0;
      grid.querySelectorAll(".furry-entry").forEach((card) => {
        const matches = (!query || card.dataset.name.includes(query))
          && (!levelFilter.value || card.dataset.level === levelFilter.value)
          && (!typeFilter.value || card.dataset.type === typeFilter.value)
          && (!familyFilter.value || card.dataset.family === familyFilter.value)
          && (!rarityFilter.value || card.dataset.rarity === rarityFilter.value);
        card.hidden = !matches;
        if (matches) visible++;
      });
      results.textContent = visible + (visible > 1 ? " cases affichées" : " case affichée") + " · 65 fiches classées, 6 illustrées";
      emptyMessage.hidden = visible > 0;
    }
    document.getElementById("cardex-filters").addEventListener("submit", (event) => event.preventDefault());
    [nameFilter, levelFilter, typeFilter, familyFilter, rarityFilter].forEach((filter) => {
      filter.addEventListener("input", filterCardex);
      filter.addEventListener("change", filterCardex);
    });
    document.getElementById("reset-filters").addEventListener("click", () => {
      document.getElementById("cardex-filters").reset();
      filterCardex();
      nameFilter.focus();
    });
  </script>
  <label class="global-mode-switch" title="Basculer entre les ambiances Jour et Nuit">
    <span class="mode-day">Jour</span>
    <input id="global-mode-toggle" type="checkbox" role="switch" aria-label="Ambiance Nuit" aria-checked="false">
    <span class="global-mode-track" aria-hidden="true"></span>
    <span class="mode-night">Nuit</span>
  </label>
  <script>
    const globalThemeSwitch = document.getElementById("global-mode-toggle");
    function applySiteTheme(time, save = false) {
      document.body.dataset.time = time;
      globalThemeSwitch.checked = time === "nuit";
      globalThemeSwitch.setAttribute("aria-checked", String(time === "nuit"));
      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.content = time === "nuit" ? "#11121a" : "#f1ead9";
      if (save) localStorage.setItem("duskclaw-time", time);
    }
    globalThemeSwitch.addEventListener("change", () => applySiteTheme(globalThemeSwitch.checked ? "nuit" : "jour", true));
    applySiteTheme(localStorage.getItem("duskclaw-time") === "nuit" ? "nuit" : "jour");
  </script>

    <a class="contact-footer-button" href="contact.html">Contact <span aria-hidden="true">→</span></a>
    <span>Un monde de cartes et de créatures.</span>
    <span>© DUSKCLAW</span>
